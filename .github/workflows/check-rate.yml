name: Check USD rate

on:
  schedule:
    # Каждые 30 минут. GitHub может задерживать запуск на пиковых нагрузках,
    # реальный интервал бывает 30–60 минут — это нормально.
    - cron: "7,37 * * * *"
  workflow_dispatch:  # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write  # нужно, чтобы коммитить last_rate.json обратно в репозиторий

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Check exchange rate
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python eubank_usd_bot.py

      - name: Commit updated state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_rate.json
          if git diff --staged --quiet; then
            echo "Курс не изменился — коммитить нечего."
          else
            git commit -m "Update USD rate state"
            git push
          fi
